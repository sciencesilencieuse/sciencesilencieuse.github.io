<link rel="stylesheet" href="{{ "css/notice.css" | relURL }}">

<script 
src="https://cdn.jsdelivr.net/npm/quizdown@latest/public/build/quizdown.js">
</script>
<script 
src="https://cdn.jsdelivr.net/npm/quizdown@latest/public/build/extensions/quizdownKatex.js">
</script>
<script 
src="https://cdn.jsdelivr.net/npm/quizdown@latest/public/build/extensions/quizdownHighlight.js">
</script>
<script>quizdown.register(quizdownHighlight).register(quizdownKatex).init()</script> 

<style>
/* filet de sécurité : le rail horizontal ne s'affiche jamais */
#sidebar .ps-scrollbar-x-rail { display: none !important; }
</style>

<script>
window.addEventListener('load', function () {
  var $el = jQuery('#sidebar .highlightable');
  if ($el.length && $el.perfectScrollbar) {
    $el.perfectScrollbar('destroy');
    $el.perfectScrollbar({ suppressScrollX: true });
  }
});
</script>

{{ if .Params.js }}
<script src="{{ .Params.js }}"></script>
{{ end }}
